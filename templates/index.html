
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartBite - Recipe Finder</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
<div class="container mt-5">
    <h1 class="text-success mb-4">🥗 SmartBite - Recipe Finder</h1>

    <!-- Search form -->
    <form method="POST" class="mb-4">
        <input type="text" name="ingredients" class="form-control" placeholder="Enter ingredients (e.g. chicken, tomato)">
        <button type="submit" class="btn btn-success mt-2">Find Recipes</button>
    </form>

    <!-- Error -->
    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <!-- Results -->
    <div class="row">
        {% for recipe in recipes %}
        <div class="col-md-4">
            <div class="card mb-4 shadow-sm">
                <img src="{{ recipe.image }}" class="card-img-top" alt="{{ recipe.title }}">
                <div class="card-body">
                    <h5 class="card-title">{{ recipe.title }}</h5>
                    <p class="card-text">
                        <strong>Calories:</strong> {{ recipe.calories }}<br>
                        <strong>Protein:</strong> {{ recipe.protein }}<br>
                        <strong>Carbs:</strong> {{ recipe.carbs }}<br>
                        <strong>Fat:</strong> {{ recipe.fat }}
                    </p>
                    <a href="{{ recipe.link }}" target="_blank" class="btn btn-sm btn-success">View Full Recipe</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
</body>
</html>
